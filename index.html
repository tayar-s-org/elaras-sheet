<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('manrakora-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'dark' || theme === 'light'
          ? theme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <meta name="theme-color" content="#192f2b" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <title>Ascensia RPG · Fichas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
